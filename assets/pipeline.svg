<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a8378"/>
    </marker>
  </defs>
  <rect width="1200" height="220" fill="#161616"/>

  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F4EFE9">
    <!-- stages -->
    <g transform="translate(20,80)">
      <rect width="150" height="60" rx="6" fill="#211d1a" stroke="#E8A25C" stroke-width="1.5"/>
      <text x="75" y="35" text-anchor="middle">Raw Retail Data</text>
    </g>

    <line x1="170" y1="110" x2="210" y2="110" stroke="#8a8378" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g transform="translate(210,80)">
      <rect width="150" height="60" rx="6" fill="#211d1a" stroke="#C9714E" stroke-width="1.5"/>
      <text x="75" y="35" text-anchor="middle">ELT Processing</text>
    </g>

    <line x1="360" y1="110" x2="400" y2="110" stroke="#8a8378" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g transform="translate(400,80)">
      <rect width="150" height="60" rx="6" fill="#211d1a" stroke="#5C7A73" stroke-width="1.5"/>
      <text x="75" y="35" text-anchor="middle">SQL Database</text>
    </g>

    <line x1="550" y1="110" x2="590" y2="110" stroke="#8a8378" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g transform="translate(590,80)">
      <rect width="150" height="60" rx="6" fill="#211d1a" stroke="#E8A25C" stroke-width="1.5"/>
      <text x="75" y="27" text-anchor="middle">RFM</text>
      <text x="75" y="45" text-anchor="middle">Segmentation</text>
    </g>

    <line x1="740" y1="110" x2="780" y2="110" stroke="#8a8378" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g transform="translate(780,80)">
      <rect width="150" height="60" rx="6" fill="#211d1a" stroke="#C9714E" stroke-width="1.5"/>
      <text x="75" y="27" text-anchor="middle">Cohort +</text>
      <text x="75" y="45" text-anchor="middle">Basket Analysis</text>
    </g>

    <line x1="930" y1="110" x2="970" y2="110" stroke="#8a8378" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g transform="translate(970,80)">
      <rect width="210" height="60" rx="6" fill="#211d1a" stroke="#F4EFE9" stroke-width="1.5"/>
      <text x="105" y="27" text-anchor="middle">CLV Model →</text>
      <text x="105" y="45" text-anchor="middle">Power BI Dashboard</text>
    </g>
  </g>

  <text x="20" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5f5a52">every stage hands off to a notebook in /notebooks — nothing here is a black box</text>
</svg>
